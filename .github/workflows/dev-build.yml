name: Development Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sigma-hotinjection-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build HotInjection
        shell: pwsh
        run: mvn -B -DskipTests clean package

      - name: Prepare launcher package
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $dist = "target/sigma-hotinjection-$short"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "hotinjection-host/target/sigma-hotinjection.jar" "$dist/client.jar"
          @"
          channel=hotinjection
          commit=$env:GITHUB_SHA
          shortCommit=$short
          java=17
          "@ | Set-Content -Encoding ascii "$dist/launch.properties"
          Compress-Archive -Path $dist -DestinationPath "target/sigma-hotinjection-$short.zip" -Force
          $hash = (Get-FileHash "target/sigma-hotinjection-$short.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sigma-hotinjection-$short.zip" | Set-Content -Encoding ascii "target/sigma-hotinjection-$short.zip.sha256"

      - name: Publish development prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "dev-$env:GITHUB_SHA"
          $title = "Development build $short"
          $message = if ($env:COMMIT_MESSAGE) { $env:COMMIT_MESSAGE } else { "manual workflow run" }
          $body = @"
          Automated HotInjection development build from commit $env:GITHUB_SHA.

          Commit: $env:GITHUB_SHA
          Message: $message

          This prerelease is consumable by SigmaJelloBootstrap-Reborn and keeps older successful builds available through History.
          "@
          gh release create $tag `
            "target/sigma-hotinjection-$short.zip" `
            "target/sigma-hotinjection-$short.zip.sha256" `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes $body `
            --prerelease
